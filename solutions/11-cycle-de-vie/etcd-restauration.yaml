# Extrait de /etc/kubernetes/manifests/etcd.yaml après l'étape 3.
# Seul le hostPath du volume etcd-data change. Le reste du fichier généré par kubeadm
# (y compris --data-dir=/var/lib/etcd, qui est le chemin DANS le conteneur) ne bouge pas.
apiVersion: v1
kind: Pod
metadata:
  name: etcd
  namespace: kube-system
spec:
  volumes:
    # … volume etcd-certs inchangé …
    - name: etcd-data
      hostPath:
        path: /var/lib/etcd/restauration   # AVANT : /var/lib/etcd
        type: DirectoryOrCreate
