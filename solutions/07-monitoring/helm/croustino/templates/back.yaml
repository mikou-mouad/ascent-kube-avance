apiVersion: apps/v1
kind: Deployment
metadata:
  name: back
  labels:
    app: back
    {{- include "croustino.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.back.replicas }}
  selector:
    matchLabels:
      app: back
  template:
    metadata:
      labels:
        app: back
        {{- include "croustino.labels" . | nindent 8 }}
      annotations:
        # Redémarre le back quand la configuration change.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: back
      {{- include "croustino.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: back
          image: {{ include "croustino.image" (list $ .Values.back.image) }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: back-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: croustino-db
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: croustino-db
                  key: POSTGRES_PASSWORD
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml .Values.back.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: back
  labels:
    app: back
    {{- include "croustino.labels" . | nindent 4 }}
spec:
  selector:
    app: back
  ports:
    - name: http
      port: 8080
      targetPort: http
