apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  labels:
    app: front
    {{- include "croustino.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.front.replicas }}
  selector:
    matchLabels:
      app: front
  template:
    metadata:
      labels:
        app: front
        {{- include "croustino.labels" . | nindent 8 }}
    spec:
      {{- include "croustino.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: front
          image: {{ include "croustino.image" (list $ .Values.front.image) }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.front.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: front
  labels:
    app: front
    {{- include "croustino.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app: front
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: {{ .Values.front.nodePort }}
