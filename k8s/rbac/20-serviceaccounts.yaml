# Le back n'appelle pas l'API Kubernetes : pas de token monté.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: back
  namespace: croustino
automountServiceAccountToken: false
---
# La CI met à jour l'image des Deployments, rien d'autre.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: croustino
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: croustino
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer
  namespace: croustino
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: croustino
roleRef:
  kind: Role
  name: deployer
  apiGroup: rbac.authorization.k8s.io
