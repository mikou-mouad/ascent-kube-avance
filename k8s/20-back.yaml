apiVersion: apps/v1
kind: Deployment
metadata:
  name: back
  namespace: croustino
  labels:
    app: back
spec:
  replicas: 2
  selector:
    matchLabels:
      app: back
  template:
    metadata:
      labels:
        app: back
    spec:
      containers:
        - name: back
          image: TODO   # l'image du back, tag 1.0 (voir README du dépôt)
          ports:
            - name: http
              containerPort: TODO   # port d'écoute de l'API (voir app/back/app.py)
          envFrom:
            - configMapRef:
                name: back-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: croustino-db
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: croustino-db
                  key: POSTGRES_PASSWORD
          # TODO : livenessProbe sur /healthz et readinessProbe sur /readyz (port "http")
---
apiVersion: v1
kind: Service
metadata:
  name: back
  namespace: croustino
  labels:
    app: back
spec:
  selector:
    TODO: TODO   # quels pods ce Service doit-il cibler ?
  ports:
    - name: http
      port: 8080
      targetPort: http
