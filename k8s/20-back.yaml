apiVersion: apps/v1
kind: Deployment
metadata:
  name: back
  namespace: croustino
  labels:
    app: back
spec:
  replicas: 2
  selector:
    matchLabels:
      app: back
  template:
    metadata:
      labels:
        app: back
    spec:
      serviceAccountName: back
      containers:
        - name: back
          image: ghcr.io/mikou-mouad/croustino-back:1.0
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: back-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: croustino-db
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: croustino-db
                  key: POSTGRES_PASSWORD
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: back
  namespace: croustino
  labels:
    app: back
spec:
  selector:
    app: back
  ports:
    - name: http
      port: 8080
      targetPort: http
