# Le service « promos » écrit à la va-vite par un prestataire : il consomme
# de plus en plus de mémoire. Ne pas garder en production !
apiVersion: apps/v1
kind: Deployment
metadata:
  name: promos
  namespace: croustino
  labels:
    app: promos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: promos
  template:
    metadata:
      labels:
        app: promos
    spec:
      containers:
        - name: promos
          image: polinux/stress
          command: ["stress"]
          args: ["--vm", "1", "--vm-bytes", "1500M", "--vm-hang", "0"]
