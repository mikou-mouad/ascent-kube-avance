# Le service « promos » : le prestataire a copié la configuration d'un traitement
# big data. Chaque pod réserve (request = limit) et consomme presque toute la
# mémoire libre d'un worker. Avec request = limit, il est en QoS Guaranteed :
# Kubernetes le protège, et ce sont les pods sans ressources déclarées qui paient.
# Ne pas appliquer directement : lancer k8s/capacite/lancer-promos.sh,
# qui remplace __MEMOIRE__ et __STRESS__ selon la taille des workers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: promos
  namespace: croustino
  labels:
    app: promos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: promos
  template:
    metadata:
      labels:
        app: promos
    spec:
      # Un pod par worker
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: promos
      containers:
        - name: promos
          image: polinux/stress
          command: ["stress", "--vm", "1", "--vm-bytes", "__STRESS__", "--vm-hang", "0"]
          resources:
            requests:
              cpu: 500m
              memory: __MEMOIRE__
            limits:
              cpu: 500m
              memory: __MEMOIRE__
