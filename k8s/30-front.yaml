apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  namespace: croustino
  labels:
    app: front
spec:
  replicas: 2
  selector:
    matchLabels:
      app: front
  template:
    metadata:
      labels:
        app: front
    spec:
      containers:
        - name: front
          image: TODO   # l'image du front, tag 1.0
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: front
  namespace: croustino
spec:
  # TODO : un Service accessible depuis l'extérieur du cluster sur le port 30080 de chaque nœud,
  #        qui cible les pods du front sur leur port "http".
