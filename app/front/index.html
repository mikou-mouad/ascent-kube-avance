<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Croustino</title>
  <style>
    :root { --accent: __COULEUR__; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #fdf8f1; color: #2b2118; }
    header { background: var(--accent); color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 1.6rem; }
    .badge { background: rgba(255,255,255,.2); border-radius: 12px; padding: 4px 10px; font-size: .85rem; }
    main { max-width: 860px; margin: 24px auto; padding: 0 16px; display: grid; gap: 24px; }
    section { background: #fff; border-radius: 10px; padding: 16px 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    label { display: block; margin: 8px 0 4px; font-weight: 600; }
    input, select, button { font: inherit; padding: 8px; border-radius: 6px; border: 1px solid #cdbfae; }
    button { background: var(--accent); color: #fff; border: none; cursor: pointer; margin-top: 12px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 6px; border-bottom: 1px solid #eee; font-size: .9rem; }
    #message { margin-top: 10px; min-height: 1.2em; }
    .erreur { color: #b00020; }
  </style>
</head>
<body>
  <header>
    <h1>🥐 Croustino <span id="ville"></span></h1>
    <span class="badge">front v__VERSION__ · <span id="pod">…</span></span>
  </header>
  <main>
    <section>
      <h2>Commander</h2>
      <label for="client">Votre nom</label>
      <input id="client" placeholder="Sophie">
      <label for="produit">Viennoiserie</label>
      <select id="produit"></select>
      <label for="quantite">Quantité</label>
      <input id="quantite" type="number" min="1" value="6">
      <br><button id="commander">Commander</button>
      <div id="message"></div>
    </section>
    <section>
      <h2>Dernières commandes</h2>
      <table>
        <thead><tr><th>N°</th><th>Client</th><th>Produit</th><th>Qté</th><th>Heure</th></tr></thead>
        <tbody id="commandes"></tbody>
      </table>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);

    async function charger() {
      try {
        const v = await (await fetch('/api/version')).json();
        $('ville').textContent = '– ' + v.ville;
        $('pod').textContent = 'back v' + v.version + ' sur ' + v.pod;
      } catch { $('pod').textContent = 'back injoignable'; }

      if (!$('produit').options.length) {
        const produits = await (await fetch('/api/produits')).json();
        for (const p of produits) $('produit').add(new Option(`${p.nom} (${p.prix.toFixed(2)} €)`, p.id));
      }

      const r = await fetch('/api/commandes');
      const corps = $('commandes');
      corps.innerHTML = '';
      if (!r.ok) { corps.innerHTML = '<tr><td colspan="5" class="erreur">Base de données indisponible</td></tr>'; return; }
      for (const c of await r.json()) {
        const tr = document.createElement('tr');
        for (const val of [c.id, c.client, c.produit, c.quantite, new Date(c.creee_le).toLocaleTimeString('fr-FR')]) {
          const td = document.createElement('td'); td.textContent = val; tr.appendChild(td);
        }
        corps.appendChild(tr);
      }
    }

    $('commander').onclick = async () => {
      const r = await fetch('/api/commandes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ client: $('client').value, produit: $('produit').value, quantite: Number($('quantite').value) }),
      });
      const corps = await r.json();
      $('message').className = r.ok ? '' : 'erreur';
      $('message').textContent = r.ok ? `Commande ${corps.id} enregistrée !` : `Erreur : ${corps.erreur}`;
      charger();
    };

    charger();
    setInterval(charger, 5000);
  </script>
</body>
</html>
