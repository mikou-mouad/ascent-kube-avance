{{- if .Values.monitoring.enabled }}
# Étape 2 : Prometheus collecte /metrics sur le Service du back.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: back
spec:
  selector:
    matchLabels:
      app: back          # le label du Service back
  endpoints:
    - port: http         # le NOM du port du Service, pas son numéro
      path: /metrics
      interval: 15s
---
# Étape 5 : l'alerte
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: croustino
spec:
  groups:
    - name: croustino
      rules:
        - alert: CroustinoRejetsEleves
          expr: sum(increase(croustino_commandes_rejetees_total{namespace="{{ .Release.Namespace }}"}[5m])) > 10
          for: 1m
          labels:
            severity: warning
            namespace: {{ .Release.Namespace }}   # pour le regroupement dans Alertmanager
          annotations:
            summary: "Croustino : plus de 10 commandes rejetées en 5 minutes"
        # Bonus : le back redémarre en boucle
        - alert: CroustinoBackRedemarre
          expr: increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}", container="back"}[10m]) > 2
          labels:
            severity: critical
            namespace: {{ .Release.Namespace }}
          annotations:
            summary: "Croustino : le back redémarre en boucle"
---
# Étape 4.5 : dashboard chargé automatiquement par Grafana (label grafana_dashboard)
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-croustino
  labels:
    grafana_dashboard: "1"
data:
  rush-du-matin.json: |-
{{ .Files.Get "dashboards/rush-du-matin.json" | indent 4 }}
{{- end }}
